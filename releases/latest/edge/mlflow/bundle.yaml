bundle: kubernetes
name: mlflow
docs: https://discourse.charmhub.io/t/mlflow-docs-index/10836
applications:
  mlflow-minio:
    charm: minio
    channel: ckf-1.10/stable
    scale: 1
    trust: true
    _github_repo_name: minio-operator
    _github_repo_branch: main
  mlflow-postgresql:
    charm: postgresql-k8s
    channel: 14/stable
    scale: 1
    trust: true
    constraints: mem=2G
    _github_dependency_repo_name: postgresql-k8s-operator
    _github_dependency_repo_branch: main
  mlflow-server:
    charm: mlflow-server
    channel: latest/edge
    scale: 1
    trust: true
    _github_dependency_repo_name: mlflow-operator
    _github_dependency_repo_branch: main
relations:
- [mlflow-server, mlflow-minio]
- [mlflow-server, mlflow-postgresql]
